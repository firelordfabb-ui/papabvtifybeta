<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>papabvtify — Next-Gen Music Streaming</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#142247" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#edf3fd] text-[#142247] overflow-hidden select-none font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const isElectron = navigator.userAgent.toLowerCase().includes('electron') || !!window.PAPABVTIFY_DESKTOP;
      const isCapacitor = window.Capacitor !== undefined || !!window.Capacitor?.isNativePlatform?.() || window.location.protocol === 'capacitor:';
      if (isElectron || isCapacitor) {
        // Desktop Electron & Capacitor: unregister any legacy service workers and clear cache storage
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (const r of regs) r.unregister();
          });
        }
        if (isElectron && 'caches' in window) {
          caches.keys().then(keys => {
            for (const k of keys) caches.delete(k);
          });
        }
      } else if ('serviceWorker' in navigator) {
        // Web / PWA only
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
