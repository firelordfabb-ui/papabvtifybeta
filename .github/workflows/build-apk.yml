name: Build Android APK (Free Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Tombol manual trigger di web GitHub

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "Using app-release.apk"
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/PAPABVTIFY.apk
          else
            echo "Falling back to app-debug.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/PAPABVTIFY.apk
          fi
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          $BUILD_TOOLS/apksigner verify --verbose apk-output/PAPABVTIFY.apk

      - name: Upload APK Ready to Install
        uses: actions/upload-artifact@v4
        with:
          name: PAPABVTIFY-APK
          path: apk-output/PAPABVTIFY.apk
